name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify content, assets and security contracts
        shell: pwsh
        run: ./tests/site-contract.ps1
      - name: Install local runtime test tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify AFK proxy routing and download contracts
        run: npm test
